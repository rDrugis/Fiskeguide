<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiskeguide – arter, regler og sesonger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
details.knot{border-top:1px solid var(--stroke);padding:7px 0}
details.knot:first-of-type{border-top:0}
details.knot summary{cursor:pointer;list-style:none;display:block}
details.knot summary::-webkit-details-marker{display:none}
details.knot summary::before{content:'▸';display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
details.knot[open] summary::before{transform:rotate(90deg)}
details.knot .ken{color:var(--muted);font-size:12px;font-style:italic}
details.knot .kbruk{display:block;margin:2px 0 0 14px;color:var(--muted);font-size:13px}
ol.ksteps{margin:8px 0 4px 14px}
.kfoot{margin-left:14px;font-size:12px;color:var(--muted)}

.wpicon.drag{cursor:grab}.wpicon.drag span{width:26px;height:26px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.leaflet-bar a.profbtn{display:flex;align-items:center;justify-content:center;color:#0c1720}
.leaflet-bar a.profbtn.on{background:#1d3557;color:#fff}
.pfpt{background:none;border:0}.pfpt span{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#1d3557;color:#fff;font:800 12px/1 system-ui,sans-serif;border:2px solid #fff;box-sizing:border-box;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.profbox{padding:0 12px 12px}.profbox[hidden]{display:none}
.card.prof{margin:0;padding:10px 12px}
.profhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}.profhead .psp{flex:1}
.pchart{width:100%;height:auto;display:block;margin-top:6px}
.pchart .pgrid{stroke:rgba(255,255,255,.1);stroke-width:1}
.pchart .plbl{fill:var(--muted);font-size:11px}
.pchart .pband{fill:rgba(79,179,255,.28);stroke:none}
.pchart .pmid{fill:none;stroke:#4fb3ff;stroke-width:2;stroke-linejoin:round}
.pchart .pland{fill:rgba(160,120,70,.55)}.pchart .pnod{fill:rgba(160,160,160,.18)}
.pchart .pab{fill:var(--text);font-size:12px;font-weight:800}
.pstat{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;margin-top:4px}
.pchart .ppos line{stroke:#f2c14e;stroke-width:2;stroke-dasharray:5 4}
.pchart .ppos circle{fill:#f2c14e;stroke:#0d1b24;stroke-width:1.5}
.pchart .ppos path{fill:#f2c14e}
.pchart .ppos text{fill:#f2c14e;font-size:12px;font-weight:800}
.pstat .pme{color:#f2c14e}.pstat .pme b{color:#f2c14e}
</style>
<style>
:root{
  /* Mørk kystnett-stil: blåsvart panel, kort i skifer, grønne og blå markeringer. */
  --bg:#050c12; --panel:#0b151e; --card:#15222c; --card2:#1a2833; --stroke:#22343f;
  --text:#e8eef2; --muted:#9aaebb; --dim:#667e8d;
  --teal:#1d8892; --bar:#38a882; --barbg:#283945;
  --ok:#59d49c; --okbg:rgba(89,212,156,.14); --warn:#f2c14e; --warnbg:rgba(242,193,78,.15);
  --bad:#ff7f6f; --badbg:rgba(255,127,111,.16); --rule:#b9a3ff; --rulebg:rgba(185,163,255,.14);
  --link:#61cfd8; --spawn:#8f7cf0; --spawnbg:rgba(143,124,240,.16);
  --c-f:#c5453e; --c-b:#c9962e; --c-a:#2aa198; --c-s:#46a86c; --c-g:#8f7cf0;
  --body:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 700px at 70% -10%,#0f2230 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 40px}
.phone{background:var(--panel);border:1px solid #1b2b36;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
/* topp */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 22px 14px;border-bottom:2px solid var(--teal)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.ico{width:44px;height:44px;border-radius:12px;background:#22323d;display:grid;place-items:center;flex:none}
.brand h1{font-weight:800;font-size:28px;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.search{margin-left:auto;position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;background:#13202a;border:1px solid var(--stroke);border-radius:12px;padding:10px 12px 10px 36px;color:var(--text);font:inherit;font-size:15px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#122029;border:1px solid var(--stroke);border-radius:12px;z-index:1200;max-height:60vh;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-bottom:1px solid #1c2b35;cursor:pointer}
.results button:hover,.results button.on{background:#1b2c37}
.results b{display:block;font-size:14px}
.results span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* faner */
.nav{display:flex;gap:8px;padding:14px 22px 0;overflow-x:auto;scrollbar-width:thin}
.nav a{flex:none;text-decoration:none;color:var(--text);background:#1a2731;border:1px solid transparent;border-radius:999px;padding:8px 15px;font-weight:700;font-size:15px}
.nav a.on{background:#eef3f6;color:#0c1720}
.nav a:hover:not(.on){border-color:#2e4250}
main{padding:18px 22px 26px}
/* område */
.regbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:#111e27;border:1px solid var(--stroke);border-radius:14px;padding:10px 14px;margin-bottom:16px}
.regbar label{color:var(--muted);font-size:13px;font-weight:600}
.regbar select{background:#1b2a35;color:var(--text);border:1px solid var(--stroke);border-radius:9px;padding:6px 8px;font:inherit;font-size:14px}
.pre{display:flex;gap:6px;flex-wrap:wrap}
.pre button{background:#1b2a35;border:1px solid var(--stroke);border-radius:8px;padding:4px 9px;font-size:13px;cursor:pointer}
.pre button.on{background:#2a4a46;border-color:#3d7a6c}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.auto{color:var(--dim);font-size:12.5px}
/* måneder */
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-bottom:16px}
.months button{position:relative;background:#1a2732;border:0;border-radius:10px;padding:14px 0 16px;font-weight:700;font-size:15px;cursor:pointer}
.months button.on{background:#eef3f6;color:#0c1720}
.months button.now::after{content:"";position:absolute;left:50%;bottom:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--bar)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stack{display:grid;gap:10px}
.card{background:var(--card);border-radius:14px;padding:16px 18px;min-width:0}
.card h3{font-size:19px;margin:0 0 10px;font-weight:800;text-wrap:balance}
.card h4{font-size:15px;margin:14px 0 6px;color:#cfe0e8}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:14px;padding:14px 18px;cursor:pointer;min-height:76px}
.row:hover{background:var(--card2)}
.row.dim{opacity:.62}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none}
.nm b{display:block;font-size:19px;font-weight:800}
.nm small{color:var(--muted);font-size:14px}
.st{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:160px}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.chips.l{justify-content:flex-start}
.chip{font-style:normal;font-weight:800;font-size:12.5px;padding:2px 8px;border-radius:7px;white-space:nowrap}
.chip.g{color:var(--ok);background:var(--okbg)}
.chip.w{color:var(--warn);background:var(--warnbg)}
.chip.x{color:var(--bad);background:var(--badbg)}
.chip.r{color:var(--rule);background:var(--rulebg)}
.chip.p{color:#b8acff;background:var(--spawnbg)}
.note{color:var(--muted);font-size:14px;margin:12px 2px 0}
/* merker */
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px;text-decoration:none;white-space:nowrap}
.tag.e{color:var(--warn);background:var(--warnbg)}
.tag.r{color:var(--rule);background:var(--rulebg)}
.tag.k{color:#8fc3ff;background:rgba(143,195,255,.12)}
a.tag:hover{filter:brightness(1.25)}
ul.f{margin:0;padding:0;list-style:none}
ul.f li{padding:7px 0;border-bottom:1px solid #22323d}
ul.f li:last-child{border-bottom:0}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #22323d;font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--muted)}
.kv>span:last-child{text-align:right;font-weight:600}
/* månedsstriper */
.mstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;width:168px}
.mstrip i{position:relative;display:block;height:12px;border-radius:3px;background:#1f2e38;overflow:hidden}
.mstrip i.cur{box-shadow:0 0 0 1.5px #e9eef2}
.mstrip i u,.ygrid i u{position:absolute;bottom:0;height:3px;background:var(--c-g);border-radius:2px}
.ygrid{display:grid;grid-template-columns:150px repeat(12,1fr);gap:5px;align-items:center}
.ygrid .h{color:var(--muted);font-weight:800;text-align:center;font-size:13px;cursor:pointer;background:none;border:0;padding:4px 0}
.ygrid .h.on{color:var(--text);text-decoration:underline}
.ygrid .sp{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer;background:none;border:0;text-align:left;padding:0;font-size:14.5px}
.ygrid i{position:relative;display:block;height:28px;border-radius:6px;background:#1c2a34;overflow:hidden}
.ygrid i.cur{box-shadow:0 0 0 2px #e9eef2}
.ygrid i u{height:5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.plist{list-style:none;margin:10px 0 0;padding:0}
.plist li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid #22323d;font-size:14.5px}
.plist li:last-child{border-bottom:0}
.plist i{flex:none;width:12px;height:12px;border-radius:3px;display:inline-block;transform:translateY(1px)}
.plist em{font-style:normal;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
/* artsside */
.back{background:none;border:0;color:var(--link);font-weight:800;font-size:16px;cursor:pointer;padding:4px 0;margin-bottom:10px}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;border-left:5px solid #888;margin-bottom:14px}
.head h2{font-size:30px;margin:0;font-weight:800}
.head em{color:var(--muted);font-style:italic}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.fact{background:#111d26;border:1px solid var(--stroke);border-radius:12px;padding:10px 12px}
.fact small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.fact b{font-size:16px;font-variant-numeric:tabular-nums}
/* gantt */
.gantt .g-row{display:grid;grid-template-columns:240px 1fr;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #1f2f39}
.gantt .lane{position:relative;height:18px;background:repeating-linear-gradient(90deg,#16232c 0 calc(100%/12 - 1px),#22323d calc(100%/12 - 1px) calc(100%/12));border-radius:5px}
.gantt .seg-b{position:absolute;top:2px;bottom:2px;border-radius:4px}
.gantt .seg-b.g{background:var(--c-g)}
.gantt .seg-b.f{background:repeating-linear-gradient(135deg,#a33a3a 0 5px,#6b2525 5px 10px)}
.gantt .seg-b.a{background:var(--c-a)}
.gantt .gm{display:grid;grid-template-columns:250px repeat(12,1fr);color:var(--muted);font-size:12px;font-weight:700;text-align:center}
.gantt .lbl{font-size:14px}
.gantt .lbl small{display:block;color:var(--dim);font-size:12px}
/* tabeller */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14.5px}
th,td{padding:8px 10px;border-bottom:1px solid #22323d;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
td.n,th.n{text-align:right}
td.here{background:rgba(56,168,130,.12);font-weight:700}
tr.cur td{background:rgba(97,207,216,.08)}
.law{border-left:3px solid var(--rule);padding:4px 0 4px 12px;margin:8px 0;color:#dcd4ff;font-size:15px}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.pill-list span{background:#1f2e38;border-radius:8px;padding:3px 9px;font-size:13.5px}
.steps{counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:10px 0 10px 42px;border-bottom:1px solid #22323d}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:#20343d;color:var(--ok);display:grid;place-items:center;font-weight:800}
.steps b{display:block}
.sec-title{font-size:22px;font-weight:800;margin:22px 2px 10px}
.sec-title:first-child{margin-top:4px}
.lead{color:var(--muted);max-width:78ch;margin:0 2px 14px}
.legend-tags{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px;margin:0 2px 14px}
.legend-tags .tag{margin-left:0}
/* kart og vær */
.kgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
.kmap{background:var(--card);border-radius:14px;overflow:hidden;position:relative}
#map{height:540px;background:#0e1a22}
/* på bred skjerm fyller kartet hele høyden ved siden av live-kortene */
@media (min-width:981px){.kgrid{align-items:stretch}.kmap{display:flex;flex-direction:column}#mapSlot{flex:1 1 auto;display:flex;flex-direction:column}#map{flex:1 1 auto;height:auto;min-height:540px}}
#map.leaflet-container{font-family:var(--body)}
.mapbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 12px;font-size:13px;color:var(--muted)}
.mapbar .tg{display:flex;gap:4px;flex-wrap:wrap}
.mapbar button,.btn{background:#1b2a35;border:1px solid var(--stroke);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text)}
.mapbar button.on{background:#eef3f6;color:#0c1720;border-color:#eef3f6}
.btn.pri{background:#21414a;border-color:#2f6b70}
.nm .ph{display:block;color:#a9c0cf;font-size:13px;line-height:1.35;margin-top:3px;font-style:italic}
.zone{color:#cfe3ea;font-size:13px}
.znote{color:var(--warn);font-size:13px;flex-basis:100%}.znote:empty{display:none}
.algoicon span{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:#08131a;font-size:14px;font-weight:700;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.pul{margin:6px 0 6px 16px;padding:0}.pul li{margin:2px 0}
.phr{border:0;border-top:1px solid rgba(0,0,0,.15);margin:8px 0}
tr.grp td{background:rgba(255,255,255,.04);color:var(--dim);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:10px}
.gtype{color:var(--muted);font-size:13px;margin:-2px 0 8px}
.gtype span{color:var(--ok)}
.plist.aar em{min-width:100px}
.plist li.now{background:#15303a;border-radius:8px;padding:6px 8px;border-bottom-color:transparent}
#ovw td,#ovw th{white-space:nowrap}
#ovw tr.cur td{background:#15303a}
.grid3 .card h3{margin-bottom:6px}
.coord{margin-left:auto;font-variant-numeric:tabular-nums}
#mapSlot{position:relative}
[hidden]{display:none!important}
.tur{position:absolute;top:10px;left:56px;right:10px;z-index:900;pointer-events:none}
.turbar{padding:8px 12px 0}
.tgrid.sm{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.tur>*{pointer-events:auto}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.ti{background:rgba(9,17,23,.9);border:1px solid #2f4350;border-radius:10px;padding:6px 9px}
.ti small{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.ti b{display:block;font-size:18px;line-height:1.25}
.ti b.sm{font-size:12.5px;line-height:1.35}
.ti span{display:block;color:var(--muted);font-size:11.5px}
.tbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tnote{display:inline-block;font-size:11.5px;color:var(--muted);margin-top:5px;background:rgba(9,17,23,.85);padding:3px 7px;border-radius:6px}
.twarn{margin-top:6px;background:#4a1d1d;border:1px solid #c5453e;border-radius:8px;padding:6px 9px;font-size:13px;font-weight:700}
.boaticon .bi{width:18px;height:24px;margin:2px auto 0;background:#f2c14e;clip-path:polygon(50% 0,100% 100%,50% 76%,0 100%);transform-origin:50% 55%}
.wpicon span{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#ff8fb1;color:#1a0b12;font-weight:800;font-size:12px;border:2px solid #fff;box-sizing:border-box}
.leaflet-tooltip.dtip{background:rgba(255,255,255,.94);color:#1f2a33;border:1px solid rgba(37,50,60,.25);border-radius:6px;font-size:10.5px;font-weight:700;padding:0 5px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.dnum,.darr{background:none;border:0}
.dnum span{display:block;font:700 9px/12px system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:rgba(20,20,20,.82);border-radius:6px;text-align:center;letter-spacing:.02em}
.darr i{display:block;width:0;height:0;margin:2px 2px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:11px solid #141414}
.algoicon.num span{font-size:13px;font-weight:800}
.srch{position:relative;background:#fff}
.leaflet-bar a.srchbtn{display:flex;align-items:center;justify-content:center;color:#0c1720}
.srchp{position:absolute;left:36px;top:0;width:min(300px,calc(100vw - 90px));background:#fff;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.35);padding:6px;z-index:1000}
.srchp[hidden]{display:none}
.srchp input{width:100%;box-sizing:border-box;border:1px solid #c6d3db;border-radius:6px;padding:7px 9px;font-size:14px;color:#0c1720;background:#fff}
.srchr{max-height:300px;overflow:auto;margin-top:4px}
.srchr button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;font-size:14px;color:#0c1720;cursor:pointer}
.srchr button:hover,.srchr button:focus{background:#eef4f7}
.srchr small{display:block;color:#5b6b75;font-size:12px}
.srchm{padding:6px 8px;color:#5b6b75;font-size:13px}
.leaflet-tooltip.dtip::before{display:none}
.driftbar{padding:0 12px 10px;font-size:13px;color:var(--muted)}
.dline,.dmini summary{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dmini summary{cursor:pointer;list-style:none;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.dmini summary::-webkit-details-marker{display:none}
.dmini summary b{color:var(--text)}
.dmini .dsub{color:var(--dim)}
.dmini .dmore{margin-left:auto;color:var(--link);font-size:12px}
.dmini[open] .dmore{opacity:.6}
.dmini .dir{width:14px;height:14px}

  const first = doy(m + 1, 1); let n = 0, s = -1, e = -1;

const perHere = (sp, reg) => (PER[sp] || []).filter(p => regOk(p.reg, reg));

/* ---------- felles biter ---------- */
const NAV = [['maned','Måned'],['aret','Året'],['arter','Arter'],['redskap','Redskap og agn'],['regler','Regler'],['handbok','Håndbok'],['ordliste','Ordliste'],['kilder','Kilder']];
const view = () => { const v = (location.hash || '').replace(/^#/, ''); return VIEWS[v] || v.indexOf('art-') === 0 ? v : 'maned'; };
function renderNav(v){
  const top = v.indexOf('art-') === 0 ? 'arter' : v;
  $('#nav').innerHTML = NAV.map(([k, n]) => '<a href="#' + k + '" class="' + (top === k ? 'on' : '') + '"' + (top === k ? ' aria-current="page"' : '') + '>' + n + '</a>').join('');
}
const findPlace = n => { for (const g of R.places){ const p = g[1].find(x => x[0] === n); if (p) return p; } return null; };
if (S.pos && S.pos.own == null) S.pos.own = !(S.pos.name && findPlace(S.pos.name));
if (!S.pos || !S.pos.own){ S.in4 = true; S.in12 = true; }
function setPos(lat, lon, name){
  S.pos = {lat, lon, name, own: false}; S.reg = regionFor(lat, lon); S.regAuto = true; S.in4 = true; S.in12 = true; save(); render();
}
function placeSel(){
  /* bare steder i valgt område */
  const groups = R.places.map(([g, all]) => [g, all.filter(p => regionFor(p[1], p[2]) === S.reg)]).filter(x => x[1].length);

function regBar(){

    (S.regAuto ? '<span class="auto">valgt ut fra stedet</span>' : '') + '<label>Sted</label>' + placeSel() + '</div>';
}
const monthBar = m => '<div class="months" role="group" aria-label="Velg måned">' + MI.map(i => '<button data-act="mon" data-m="' + i + '" class="' + (i === m ? 'on' : '') + (i === nowM ? ' now' : '') + '" aria-pressed="' + (i === m) + '">' + MS[i] + '</button>').join('') + '</div>';

/* ---------- MÅNED ---------- */
function rowHtml(sp, m, reg){
  const a = ART[sp], ci = cellInfo(sp, m, reg), dim = ci.main && ci.main.p.t === 'f' && ci.main.c.f > 0.96, ph = phaseNow(sp, m, reg);
  return '<button class="row' + (dim ? ' dim' : '') + '" data-go="art-' + sp + '"><span class="dot" style="background:' + a.col + '"></span>' +
    '<span class="nm"><b>' + esc(a.no) + '</b><small>' + esc(a.kort) + '</small>' + (ph ? '<span class="ph">' + esc(ph.t) + '</span>' : '') + '</span>' +
    '<span class="st">' + strip(sp, reg, m) + '<span class="chips">' + chipHtml(chipsFor(sp, m, reg, true)) + '</span></span></button>';
}
function happening(m){
  return '<div class="card"><h3>Dette skjer i ' + MON[m] + '</h3><ul class="f">' +
    R.months[m].map(([t, x, s]) => '<li>' + esc(x) + (t === 'r' ? TAG.r : t === 'x' ? TAG.e : '') + src([s]) + '</li>').join('') + '</ul></div>';
}
function monthGroups(m, reg){
  const g = {open:[], spawn:[], closed:[], lim:[]};
  spHere(reg).forEach(sp => {
    const ci = cellInfo(sp, m, reg), nm = ART[sp].no;
    if (ci.main){ const t = ci.main.p.t, txt = partTxt(ci.main, m); if (t === 'f') g.closed.push([sp, nm, txt]); else if (t === 'b') g.lim.push([sp, nm, txt]); else g.open.push([sp, nm, txt]); }
    if (ci.g) g.spawn.push([sp, nm, partTxt(ci.g, m)]);
  });
  return g;
}
function summaryCard(m, reg, title){
  const g = monthGroups(m, reg);
  const line = (lbl, arr, cls) => '<div class="kv" style="display:block"><span style="display:block;margin-bottom:4px">' + lbl + '</span>' + (arr.length ? '<span class="chips l">' + arr.map(x => '<em class="chip ' + cls + '" style="cursor:pointer" data-go="art-' + x[0] + '" title="' + esc(x[2]) + '">' + esc(x[1]) + '</em>').join('') + '</span>' : '<span style="color:var(--dim);font-weight:500">Ingen</span>') + '</div>';
  return '<div class="card"><h3>' + esc(title) + '</h3>' + line('Sesong eller åpent vindu', g.open, 'g') + line('Gyter eller parrer seg nå', g.spawn, 'p') + line('Fredet eller forbudt', g.closed, 'x') + line('Begrenset', g.lim, 'w') + '</div>';
}
function renderMonth(){
  const m = month(), reg = REG();
  let h = regBar() + monthBar(m);
  const order = spHere(reg).slice().sort((a, b) => { const A = cellInfo(a, m, reg).main, B = cellInfo(b, m, reg).main; const pa = A ? {f:4, b:3, a:0, s:0}[A.p.t] : 1, pb = B ? {f:4, b:3, a:0, s:0}[B.p.t] : 1; return pa - pb; });
  h += '<div class="grid2" style="align-items:start"><div class="stack">' + summaryCard(m, reg, cap(MON[m]) + ' · ' + reg.navn) + happening(m) + '</div><div class="stack">' + order.map(sp => rowHtml(sp, m, reg)).join('') + statusLegend() + areaNote(reg) + '</div></div>';
  return h + '<p class="note">Stripen viser hele året for området; hvit ramme er valgt måned. Den grå teksten under artsnavnet er hva arten gjør denne måneden. Trykk på en art for detaljer.</p>';
}

/* ---------- HELE ÅRET ---------- */
function frac(md, end){ let d = 0; for (let i = 0; i < md[0] - 1; i++) d += DIM[i]; return (d + md[1] - (end ? 0 : 1)) / 365; }
function segs(st, en){ const a = frac(st, false), b = frac(en, true); return a <= b ? [[a, b]] : [[a, 1], [0, b]]; }
function gantt(rows, title){
  return '<div class="card" style="margin-top:16px"><h3>' + esc(title) + '</h3><div class="gantt tbl"><div style="min-width:640px"><div class="gm"><span></span>' + MS.map(x => '<span>' + x + '</span>').join('') + '</div>' +
    rows.map(([n, t, st, en, s, note]) => '<div class="g-row"><div class="lbl">' + esc(n) + src([s]) + '<small>' + esc(note) + '</small></div><div class="lane">' +
      segs(st, en).map(([a, b]) => '<span class="seg-b ' + t + '" style="left:' + (a * 100).toFixed(2) + '%;width:' + ((b - a) * 100).toFixed(2) + '%"></span>').join('') + '</div></div>').join('') +
    '</div></div><div class="legend"><span><i style="background:var(--c-g)"></i>Gyting/parring</span><span><i style="background:repeating-linear-gradient(135deg,#a33a3a 0 4px,#6b2525 4px 8px)"></i>Fredet eller forbudt</span><span><i style="background:var(--c-a)"></i>Åpen periode</span></div></div>';
}
function renderYear(){
  const m = month(), reg = REG();
  let h = regBar() + '<div class="card"><h3>Året for hver art · ' + esc(reg.navn) + '</h3><div class="ygrid"><span></span>' + MI.map(i => '<button class="h' + (i === m ? ' on' : '') + '" data-act="monY" data-m="' + i + '" aria-label="' + MON[i] + '">' + MS[i] + '</button>').join('');
  spHere(reg).forEach(sp => {
    h += '<button class="sp" data-go="art-' + sp + '"><span class="dot" style="background:' + ART[sp].col + ';width:12px;height:12px"></span>' + esc(ART[sp].no) + '</button>' +
      MI.map(i => cellHtml(cellInfo(sp, i, reg), i === m ? 'cur' : '', cellTitle(sp, i, reg))).join('');
  });
  h += '</div>' + statusLegend() + '<p class="note">Bygger på perioder i lov og kilder for valgt område. Tomme ruter betyr ingen særskilt periode – ikke at det er tomt for fisk.</p>' + areaNote(reg) + '</div>';
  h += gantt(R.cal, 'Viktige perioder og datoer');
  return h;
}

function renderSpecies(sp){

  h += '<div class="card"><h3>Gyting, mat og atferd</h3><ul class="f">' + li(r.gyting) + (r.mat ? '<li>' + item(r.mat) + '</li>' : '') + '</ul><h4>Når og hvor den biter</h4><ul class="f">' + li(r.bite) + '</ul></div>';

    '<p class="note">Levende fisk som agn er forbudt' + src(['matt_agn']) + '. <a href="#redskap" data-go="redskap">Redskap og rigger ›</a></p></div>';
  h += '<div class="card"><h3>Kjennetegn og størrelse</h3><ul class="f">' + li(r.kjenn) + (r.str ? '<li>' + item(r.str) + '</li>' : '') + '</ul></div>';
  const lawRows = sp === 'kveite' ? R.lov.filter(l => /§ 39|§ 51|§ 19/.test(l[0])) : sp === 'uer' ? R.lov.filter(l => /§ 39/.test(l[0])) : sp === 'krabbe' ? R.lov.filter(l => /§ 28/.test(l[0])) : sp === 'breiflabb' ? R.lov.filter(l => /§ 39|§ 19/.test(l[0])) : ['lysing','hvitting','taskekrabbe','steinbit','piggskate'].indexOf(sp) >= 0 ? R.lov.filter(l => /§ 47/.test(l[0])) : sp === 'torsk' ? R.lov.filter(l => /§ 19|31–33a/.test(l[0])) : (sp === 'sei' || sp === 'makrell') ? R.lov.filter(l => /§ 48/.test(l[0])) : [];

  return h + '</div>';

  let h = regBar() + '<h2 class="sec-title">Minstemål der du er</h2><p class="lead">Område: <b>' + esc(reg.navn) + '</b>' + (reg.n62 && !S.in4 ? ', mer enn 4 nm utenfor grunnlinjen' : '') + '. Tallene er fra høstingsforskriften slik den lyder etter J-78-2026 (18. mai 2026)' + src(['j78']) + '.</p>';
  h += '<div class="card tbl"><table><thead><tr><th>Art</th><th>Der du er</th><th>Nord 62°, innenfor 4 nm</th><th>Nord 62°, utenfor 4 nm</th><th>Sør for 62° N</th><th>Merknad</th></tr></thead><tbody>' +
    spHere(reg).map(sp => { const mh = minHere(sp, reg); return '<tr><td><span class="dot" style="background:' + ART[sp].col + ';width:10px;height:10px;margin-right:6px"></span><b>' + esc(ART[sp].no) + '</b></td><td class="here">' + esc(mh[0]) + '</td>' + MINTAB[sp].map(v => '<td>' + esc(v) + '</td>').join('') + '<td style="color:var(--muted)">' + esc(mh[1]) + '</td></tr>'; }).join('') +
    '</tbody></table></div><p class="note">* Gjelder ikke makrell og sei som ikke skal selges (§ 48). Andre arter (flatfisk, sild, pigghå, sjøkreps …) står under <a href="#arter" data-go="arter">Arter</a>.</p>' + legendTags();
  h += areaNote(reg);
  h += gantt(R.cal.filter(c => c[1] !== 'g'), 'Fredning og åpne perioder');
  h += '<h2 class="sec-title">Fritidsfiske</h2><div class="grid2">' + R.fritid.map(f => '<div class="card" id="f-' + slug(f[0]) + '"><h3>' + esc(f[0]) + '</h3><p style="margin:0">' + esc(f[1]) + src(f[2]) + '</p></div>').join('') + '</div>';
  h += '<h2 class="sec-title">Lovteksten ordrett</h2><p class="lead">Lover og forskrifter er ikke vernet av opphavsrett, så her er de viktigste setningene slik de står. Fjordlinje-paragrafene og § 28 er fra Lovdata-utgaven fra 2024 og kan være endret siden.</p><div class="grid2">' +
    R.lov.map(l => '<div class="card"><h3>' + esc(l[0]) + src([l[2]]) + '</h3>' + l[1].map(t => '<div class="law">' + esc(t) + '</div>').join('') + '</div>').join('') + '</div>';
  return h;
}

  let h = '<h2 class="sec-title">Redskapstyper</h2><p class="lead">Hva redskapene er, hva de tar, og hva fritidsfiskere har lov til. Levende fisk som agn er forbudt' + src(['matt_agn']) + '.</p><div class="grid3">' +
    R.redskap.map(r => '<div class="card" id="g-' + slug(r.navn) + '"><h3>' + esc(r.navn) + '</h3><div class="gtype">' + esc(r.type) + ' · <span>' + esc(r.arter) + '</span></div><p style="margin:0">' + esc(r.t) + tg(r.k) + src(r.s) + '</p>' +
      (r.ekstra ? '<ul class="f" style="margin-top:8px">' + r.ekstra.map(e => '<li>' + esc(e[0]) + tg(e[2]) + src(e[1]) + '</li>').join('') + '</ul>' : '') + '</div>').join('') + '</div>';
  h += '<h2 class="sec-title">Teknikk: drift, anker og timing</h2><div class="card"><ul class="f">' + R.teknikk.map(t => '<li>' + esc(t[0]) + tg(t[2]) + src(t[1]) + '</li>').join('') + '</ul></div>';
  h += '<h2 class="sec-title">Rigger til stangfiske</h2><p class="lead">Vanlig praksis – juster etter dyp, strøm og drift.</p><div class="grid3">' +
    R.rigs.map(rg => '<div class="card"><h3>' + esc(rg[0]) + TAG.e + '</h3><div style="color:var(--ok);font-weight:700;font-size:14px;margin-bottom:6px">' + esc(rg[1]) + '</div><p style="margin:0">' + esc(rg[2]) + '</p></div>').join('') + '</div>';

    '<div class="card"><h3>Slik leser du krokstørrelser</h3><ul class="f">' + R.krokInfo.map(k => '<li>' + esc(k[0]) + ' ' + (k[1] ? src(k[1]) : TAG.e) + '</li>').join('') + '</ul><p class="note">Størrelsene er vanlige utgangspunkt, ikke regler – merker og modeller varierer. Linjer merket «Erfaring» har jeg ikke funnet en god kilde for.</p></div></div>';

  const keys = ['Redskap uten merkeregistrert båt','Line etter kveite','Garn og laksefisk','Skagerrak','Levende agn','Kongekrabbe'];
  h += '<h2 class="sec-title">Redskapsregler for fritidsfiskere</h2><div class="grid2">' + R.fritid.filter(f => keys.indexOf(f[0]) >= 0).map(f => '<div class="card"><h3>' + esc(f[0]) + '</h3><p style="margin:0">' + esc(f[1]) + src(f[2]) + '</p></div>').join('') +

  return h;
}

/* ---------- HÅNDBOK ---------- */
function calcHtml(){
  const c = store.get('calc', {tank: 40, lph: 8, kn: 15, res: 33});
  return '<div class="calc">' + [['tank','Tank (liter)',c.tank],['lph','Forbruk (liter/time)',c.lph],['kn','Marsjfart (knop)',c.kn],['res','Reserve (%)',c.res]].map(f => '<div><label for="c-' + f[0] + '">' + f[1] + '</label><input id="c-' + f[0] + '" data-calc="' + f[0] + '" type="number" min="0" step="any" value="' + esc(f[2]) + '"></div>').join('') + '</div><div class="res3" id="calcOut">' + calcOut(c) + '</div>';
}
function calcOut(c){
  const tank = +c.tank, lph = +c.lph, kn = +c.kn, res = Math.min(95, Math.max(0, +c.res));
  if (!(tank > 0 && lph > 0 && kn > 0)) return '<div class="fact"><small>Rekkevidde</small><b>Fyll inn tallene</b></div>';
  const hrs = tank / lph, nm = hrs * kn, use = nm * (1 - res / 100);
  return fact('Full tank', fmt(nm, 0) + ' nm · ' + fmt(hrs, 1) + ' t') + fact('Brukbart med ' + fmt(res, 0) + ' % i reserve', fmt(use, 0) + ' nm') + fact('Lengst ut og hjem igjen', fmt(use / 2, 0) + ' nm ut');
}
function renderHandbook(){
  const b = R.hb.blogg;
  let h = '<h2 class="sec-title" id="r-blogg">Bløgging – steg for steg</h2><div class="grid2"><div class="card"><ol class="steps">' +
    b.steg.map(s => '<li><b>' + esc(s[0]) + '</b>' + esc(s[1]) + src(s[2]) + '</li>').join('') + '</ol></div>' +
    '<div class="card"><h3>Verdt å vite</h3><ul class="f">' + b.fakta.map(f => '<li>' + esc(f[0]) + src(f[1]) + '</li>').join('') + '</ul></div></div>';
  h += '<div class="grid2" style="margin-top:14px">';
  ['is','diesel','vaer','mob','strom','ekko','anker'].forEach(k => { const v = R.hb[k];
    h += '<div class="card" id="r-' + k + '"><h3>' + esc(v.tittel) + '</h3><ul class="f">' + v.punkter.map(p => '<li>' + esc(p[0]) + ' ' + (p[1] ? src(p[1]) : TAG.e) + '</li>').join('') + '</ul>' +
      (k === 'diesel' ? '<h4>Rekkeviddekalkulator</h4>' + calcHtml() + '<p class="note">Ren regning: tank ÷ forbruk × fart. Forbruket må du kjenne for din båt og last – det øker kraftig med farten og med sjø og motvind.</p>' : '') + '</div>'; });
  h += '</div>';
  { const K = R.knuter, lbl = id => /^(ak_|nk_)/.test(id) ? 'Se animasjon' : 'Se tegning',
      kn = arr => arr.map(k => '<details class="knot" id="k-' + slug(k.n) + '"><summary><b>' + esc(k.n) + '</b> <span class="ken">' + esc(k.en) + '</span><span class="kbruk">' + esc(k.bruk) + '</span></summary><ol class="steps ksteps">' + k.steg.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol><div class="kfoot">' + src(k.s) + ' · <a href="' + esc(SRC[k.a][1]) + '" target="_blank" rel="noopener">' + lbl(k.a) + '</a></div></details>').join('');
    h += '<h2 class="sec-title" id="r-knuter">Knuteguide</h2><p class="lead">' + esc(K.intro[0]) + src(K.intro[1]) + ' Trinnene er skrevet med egne ord – trykk på en knute for trinnene, og følg lenken for animasjon eller tegning.</p>' +
      '<div class="grid2"><div class="card"><h3>Tau – båt, fortøyning og anker</h3>' + kn(K.tau) + '</div><div class="card"><h3>Fiskesnøre</h3>' + kn(K.snore) + '<h4>Tips</h4><ul class="f">' + K.tips.map(x => '<li>' + esc(x[0]) + ' ' + (x[1] ? src(x[1]) : TAG.e) + '</li>').join('') + '</ul></div></div>'; }
  h += '<h2 class="sec-title" id="r-vind">Vind: Beauforts skala</h2><div class="card tbl"><table><thead><tr><th>Styrke</th><th>Navn</th><th class="n">m/s</th><th class="n">Knop</th><th>Virkning på sjøen</th></tr></thead><tbody>' +
    R.beaufort.map(x => '<tr><td>' + x[0] + '</td><td><b>' + esc(x[1]) + '</b></td><td class="n">' + fmt(x[2], 1) + (x[3] == null ? '+' : '–' + fmt(x[3], 1)) + '</td><td class="n">' + esc(x[4]) + '</td><td>' + (x[5] ? esc(x[5]) + src([x[6]]) : '<span style="color:var(--dim)">–</span>') + '</td></tr>').join('') +
    '</tbody></table><p class="note">Navn og grenser: Store norske leksikon' + src(['snl_beaufort']) + '. Beskrivelsene er sammenfattet med egne ord.</p></div>';
  h += '<h2 class="sec-title" id="r-sjo">Sjøgang: WMO-betegnelser</h2><div class="card tbl"><table><thead><tr><th>Kode</th><th>WMO</th><th>Norsk (min oversettelse)</th><th class="n">Bølgehøyde</th></tr></thead><tbody>' +
    R.sjo.map(x => '<tr><td>' + x[0] + '</td><td>' + esc(x[1]) + '</td><td><b>' + esc(x[2]) + '</b></td><td class="n">' + (x[4] == null ? 'over ' + fmtT(x[3]) + ' m' : x[3] === x[4] ? '0 m' : fmtT(x[3]) + '–' + fmtT(x[4]) + ' m') + '</td></tr>').join('') +
    '</tbody></table><p class="note">Kilde: WMO' + src(['wmo_sea']) + '. Betegnelsene brukes for vindsjø; dønning har egne betegnelser.</p></div>';
  h += '<div class="grid2" style="margin-top:14px">' + R.hav.slice(0, 3).map((x, i) => '<div class="card" id="r-hav' + i + '"><h3>' + esc(x[0]) + '</h3><ul class="f">' + x[1].map(p => '<li>' + esc(p[0]) + (p[1] ? src(p[1]) : TAG.e) + '</li>').join('') + '</ul></div>').join('') + '</div>';
  return h;
}

function renderGloss(){
  return '<h2 class="sec-title">Ordliste</h2><div class="card"><div class="grid2">' + R.gloss.map(g => '<div class="kv" style="display:block" id="o-' + slug(g[0]) + '"><b>' + esc(g[0]) + '</b><div style="color:var(--muted)">' + esc(g[1]) + '</div></div>').join('') + '</div></div>';
}
function renderSources(){
  return '<h2 class="sec-title">Kilder</h2><p class="lead">Fakta og regler er lest i november 2026. Lovteksten er hentet fra Fiskeridirektoratets J-melding med hele forskriften (J-78-2026) og en Lovdata-utgave fra 2024.</p>' + legendTags() +
    '<div class="card"><ul class="f">' + Object.entries(SRC).map(([k, v]) => '<li><a href="' + esc(v[1]) + '" target="_blank" rel="noopener">' + esc(v[0]) + '</a> <span class="tag k">' + esc(short(k)) + '</span></li>').join('') + '</ul></div>';
}

/* ---------- SØK ---------- */
let INDEX = null;
function buildIndex(){
  const I = [];
  const txt = a => (a || []).map(x => x.t).join(' ');
  ORDER.forEach(sp => { const a = ART[sp], r = R.sp[sp]; I.push({t:a.no, s:'Art · ' + a.lat, h:'art-' + sp, x:[a.no, a.lat, a.kort, txt(r.kjenn), r.str && r.str.t, txt(r.hvor), txt(r.gyting), r.mat && r.mat.t, txt(r.bite), txt(r.metode)].join(' ')}); });
  R.extra.forEach(x => I.push({t:x.navn, s:'Andre arter · minstemål', h:'arter', a:'x-' + slug(x.navn), x:x.navn + ' ' + x.min + ' ' + (x.om || '')}));
  R.fritid.forEach(x => I.push({t:x[0], s:'Regler · fritidsfiske', h:'regler', a:'f-' + slug(x[0]), x:x[0] + ' ' + x[1]}));
  R.lov.forEach(x => I.push({t:x[0], s:'Lovtekst', h:'regler', x:x[0] + ' ' + x[1].join(' ')}));
  I.push({t:R.hb.blogg.tittel, s:'Håndbok', h:'handbok', a:'r-blogg', x:'bløgging bløgge blø ut kutt strupe gjeller utblødning sløying ' + R.hb.blogg.steg.map(s => s.join(' ')).join(' ')});
  ['is','diesel','vaer','mob','strom','ekko','anker'].forEach(k => I.push({t:R.hb[k].tittel, s:'Håndbok', h:'handbok', a:'r-' + k, x:R.hb[k].tittel + ' ' + R.hb[k].punkter.map(p => p[0]).join(' ') + (k === 'diesel' ? ' rekkevidde kalkulator tank forbruk knop tredjedelsregel' : '')}));
  R.knuter.tau.concat(R.knuter.snore).forEach(k => I.push({t:k.n, s:'Håndbok · knuter', h:'handbok', a:'k-' + slug(k.n), x:'knute knop stikk ' + k.n + ' ' + k.en + ' ' + k.bruk + ' ' + k.steg.join(' ')}));
  I.push({t:'Knuteguide', s:'Håndbok', h:'handbok', a:'r-knuter', x:'knuter knute knop stikk tau fiskesnøre fortom flette ' + R.knuter.tau.concat(R.knuter.snore).map(k => k.n).join(' ')});
  I.push({t:'Beauforts skala (vind)', s:'Håndbok · vind', h:'handbok', a:'r-vind', x:'vind vindstyrke beaufort kuling bris storm m/s knop ' + R.beaufort.map(b => b[1]).join(' ')});
  I.push({t:'Sjøgang (WMO)', s:'Håndbok · bølger', h:'handbok', a:'r-sjo', x:'sjøgang bølger bølgehøyde grov sjø moderat ' + R.sjo.map(b => b[2]).join(' ')});
  R.hav.slice(0, 3).forEach((x, i) => I.push({t:x[0], s:'Håndbok · hav', h:'handbok', a:'r-hav' + i, x:x[0] + ' ' + x[1].map(p => p[0]).join(' ')}));
  R.rigs.forEach(rg => I.push({t:rg[0], s:'Rigg · ' + rg[1], h:'redskap', x:rg.join(' ')}));
  I.push({t:'Krokstørrelser', s:'Redskap og agn', h:'redskap', a:'g-kroker', x:'krok krokstørrelse kroker sirkelkrok assistkrok ' + R.kroker.map(k => k.slice(0, 3).join(' ')).join(' ')});
  R.extra.forEach(x => { const i = R.extraInfo[x.navn] || {}; I.push({t:x.navn, s:'Andre arter · ' + x.min, h:'arter', a:'x-' + slug(x.navn), x:[x.navn, x.min, i.hvor, i.metode, x.om].join(' ')}); });
  R.redskap.forEach(r => I.push({t:r.navn, s:'Redskap · ' + r.arter, h:'redskap', a:'g-' + slug(r.navn), x:[r.navn, r.type, r.arter, r.t].concat((r.ekstra || []).map(e => e[0])).join(' ')}));
  Object.keys(R.aar).forEach(sp => I.push({t:ART[sp].no + ' gjennom året', s:'Atferd før og etter gyting', h:'art-' + sp, x:'gyting atferd vandring sesong før etter ' + ART[sp].no + ' ' + R.aar[sp].map(p => p.t).join(' ')}));
  R.gloss.forEach(g => I.push({t:g[0], s:'Ordliste', h:'ordliste', a:'o-' + slug(g[0]), x:g.join(' ')}));
  MON.forEach((mn, i) => I.push({t:cap(mn), s:'Måned', h:'maned', m:i, x:mn + ' ' + R.months[i].map(z => z[1]).join(' ')}));
  return I;
}
const norm = t => String(t).toLowerCase();
let hits = [], hi = 0;
function search(q){
  INDEX = INDEX || buildIndex();
  const terms = norm(q).split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return INDEX.map(it => { const x = norm(it.t + ' ' + it.x), t = norm(it.t); if (!terms.every(w => x.indexOf(w) >= 0)) return null; let sc = 0; terms.forEach(w => { if (t.indexOf(w) === 0) sc += 6; else if (t.indexOf(w) >= 0) sc += 3; }); return [sc, it]; })
    .filter(Boolean).sort((a, b) => b[0] - a[0]).slice(0, 14).map(x => x[1]);
}
function showResults(){
  const box = $('#res'), q = $('#q').value.trim();
  hits = q ? search(q) : []; hi = 0;
  if (!q){ box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = hits.length ? hits.map((it, i) => '<button data-hit="' + i + '" class="' + (i === hi ? 'on' : '') + '"><b>' + esc(it.t) + '</b><span>' + esc(it.s) + '</span></button>').join('') : '<button disabled><b>Ingen treff</b><span>Prøv et annet ord, f.eks. «minstemål», «tidevann» eller «kveite»</span></button>';
}
function openHit(it){
  if (!it) return;
  if (it.m != null){ S.m = it.m === nowM ? null : it.m; save(); }
  pending = it.a || null;
  $('#res').hidden = true; $('#q').value = '';
  if (view() === it.h) render(); else location.hash = it.h;
}

const VIEWS = {maned:renderMonth, aret:renderYear, arter:renderSpeciesList, regler:renderRules, redskap:renderGear, handbok:renderHandbook, ordliste:renderGloss, kilder:renderSources};
function render(){
  const v = view(); renderNav(v);
  $('#app').innerHTML = v.indexOf('art-') === 0 ? renderSpecies(v.slice(4)) : (VIEWS[v] || renderMonth)();
  if (pending){ const el = document.getElementById(pending); pending = null; if (el){ if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({block:'start'}); el.style.boxShadow = '0 0 0 2px var(--link)'; } }
}
window.addEventListener('hashchange', () => { render(); if (!pending) window.scrollTo(0, Math.min(window.scrollY, ($('.nav').getBoundingClientRect().top + window.scrollY))); });
document.addEventListener('click', e => {
  const hit = e.target.closest('[data-hit]'); if (hit){ openHit(hits[+hit.dataset.hit]); return; }
  const go = e.target.closest('[data-go]'); if (go){ e.preventDefault(); const t = go.dataset.go; if (go.dataset.anchor) pending = go.dataset.anchor; if (view() === t) render(); else location.hash = t; return; }
  const a = e.target.closest('[data-act]'); if (!a) { if (!e.target.closest('.search')) $('#res').hidden = true; return; }
  const d = a.dataset;
  if (d.act === 'mon' || d.act === 'monY'){ const m = +d.m; S.m = m === nowM ? null : m; save(); if (d.act === 'monY' && view() !== 'maned'){ location.hash = 'maned'; } else render(); }
  else if (d.act === 'showall'){ e.preventDefault(); S.showAll = !S.showAll; save(); render(); }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset && t.dataset.chg; if (k !== 'reg' && k !== 'place') return;
  if (k === 'place'){ const p = findPlace(t.value); if (p) setPos(p[1], p[2], p[0]); return; }
  if (k === 'reg'){ S.reg = t.value; S.regAuto = false; }
  save(); render();
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.calc) return;
  const c = store.get('calc', {tank: 40, lph: 8, kn: 15, res: 33}); c[t.dataset.calc] = t.value; store.set('calc', c);
  const out = document.getElementById('calcOut'); if (out) out.innerHTML = calcOut(c);
});
$('#q').addEventListener('input', showResults);
$('#q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); if (!hits.length) return; hi = (hi + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length; [...$('#res').querySelectorAll('[data-hit]')].forEach((b, i) => b.classList.toggle('on', i === hi)); }
  else if (e.key === 'Enter'){ e.preventDefault(); openHit(hits[hi]); }
  else if (e.key === 'Escape'){ $('#res').hidden = true; $('#q').blur(); }
});
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('#q') && !/input|select|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); $('#q').focus(); } });
render();
})();

</script>
